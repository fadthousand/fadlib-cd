[package]
name = "fadthousand/fadlib-cd"
version = "0.1.4"
description = "Fad Library — Personal EPUB Archive and Circulation System"

[dependencies]
"php/php" = "^8.3"

[fs]
"/" = "."

[[command]]
name = "run"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-S", "0.0.0.0:8080", "-t", "/public"]
